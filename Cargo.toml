# https://kryptografie.de/kryptografie/chiffre/doppelter-spaltentausch.htm
# https://infsec.de/doppelwuerfel/Doppelwuerfel_Tim_Wambach_final.pdf

[workspace]
resolver = "3"
members = ["dtc-logic", "dtc-tui"]

[workspace.dependencies]
itertools = "0.14"
unicode-segmentation = "1.13"
pretty_assertions = "1.4"
rstest = "0.26"
ratatui = "0.30.2"
crossterm = "0.29.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
